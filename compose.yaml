services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: monopoly
      POSTGRES_USER: monopoly
      POSTGRES_PASSWORD: monopoly
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monopoly -d monopoly"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - monopoly-postgres-data:/var/lib/postgresql/data

volumes:
  monopoly-postgres-data:
