name: Release Candidate
run-name: ${{ startsWith(github.ref, 'refs/tags/') && format('Release {0}', github.ref_name) || 'Release Candidate' }}

on:
  # A pushed version tag (v1.0.0, or v1.0.1-rc.1 for a pre-release) builds the three targets and, once every target
  # passes, publishes them as a GitHub Release. A manual dispatch stays a validation run: it ends with the uploaded
  # workflow artifacts and publishes nothing.
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      socket_url:
        description: Optional absolute HTTP(S) multiplayer server URL to inject into the packaged app
        required: false
        type: string
      distribution_mode:
        description: Use signed distribution only when all secure signing inputs are available
        required: true
        default: unsigned-validation
        type: choice
        options:
          - unsigned-validation
          - signed

permissions:
  contents: read

jobs:
  quality:
    name: Release quality gates
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://monopoly:monopoly@localhost:5432/monopoly
      TEST_DATABASE_URL: postgresql://monopoly:monopoly@localhost:5432/monopoly
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: monopoly
          POSTGRES_USER: monopoly
          POSTGRES_PASSWORD: monopoly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monopoly -d monopoly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Check the release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the root package.json version $version; the installers are named after that version."
            exit 1
          fi
          if [ ! -f ".github/release-notes/$GITHUB_REF_NAME.md" ]; then
            echo "::error::The release notes .github/release-notes/$GITHUB_REF_NAME.md are missing."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Node and pnpm toolchain
        run: |
          node --version
          pnpm --version
          pnpm exec node --version
          pnpm exec node --input-type=module -e "import { readFileSync } from 'node:fs'; import { strict as assert } from 'node:assert'; const packageJson = JSON.parse(readFileSync('package.json', 'utf8')); const minimumNodeMajor = Number(/^>=\s*(\d+)/.exec(packageJson.engines.node)?.[1]); const expectedPnpmVersion = /^pnpm@(.+)$/.exec(packageJson.packageManager)?.[1]; const userAgent = process.env.npm_config_user_agent ?? ''; const pnpmVersion = /^pnpm\/([^ ]+)/.exec(userAgent)?.[1]; const agentNodeVersion = /node\/v([^ ]+)/.exec(userAgent)?.[1]; assert(Number(process.versions.node.split('.')[0]) >= minimumNodeMajor, 'Node runtime does not satisfy package.json engines.node'); assert.strictEqual(pnpmVersion, expectedPnpmVersion, 'pnpm runtime does not match package.json packageManager'); assert.strictEqual(agentNodeVersion, process.versions.node, 'pnpm exec node did not resolve to the setup-node runtime');"

      - name: Validate V1 release contract
        run: pnpm validate:v1-contract

      - name: Test V1 release contract
        run: pnpm test:v1-contract
      - name: Test gameplay music transport
        run: pnpm test:music-transport
      - name: Validate gameplay music assets
        run: pnpm validate:music-assets
      - name: Test gameplay music validator
        run: pnpm test:music-validator
      - name: Validate card artwork
        run: pnpm validate:card-art
      - name: Test card artwork validator
        run: pnpm test:card-art
      - name: Validate landmark artwork
        run: pnpm validate:landmark-art
      - name: Test landmark artwork validator
        run: pnpm test:landmark-art
      - name: Apply database migrations
        run: pnpm db:migrate
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build renderer
        run: pnpm build

  distributable:
    name: ${{ matrix.label }}
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            platform: win32
            os: windows-latest
            arch: x64
            artifact: own-the-block-windows-x64
          - label: macOS x64
            platform: darwin
            os: macos-15-intel
            arch: x64
            artifact: own-the-block-macos-x64
          - label: macOS arm64
            platform: darwin
            os: macos-15
            arch: arm64
            artifact: own-the-block-macos-arm64
    env:
      OWN_THE_BLOCK_RELEASE_SOCKET_URL: ${{ inputs.socket_url }}
      OWN_THE_BLOCK_RELEASE_BUILD: '1'
      OWN_THE_BLOCK_RELEASE_PLATFORM: ${{ matrix.platform }}
      OWN_THE_BLOCK_RELEASE_ARCH: ${{ matrix.arch }}
      # A tag push carries no inputs: it builds the unsigned LAN-first release. Signed distribution stays a manual dispatch.
      OWN_THE_BLOCK_DISTRIBUTION_MODE: ${{ inputs.distribution_mode || 'unsigned-validation' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Node and pnpm toolchain
        run: |
          node --version
          pnpm --version
          pnpm exec node --version
          pnpm exec node --input-type=module -e "import { readFileSync } from 'node:fs'; import { strict as assert } from 'node:assert'; const packageJson = JSON.parse(readFileSync('package.json', 'utf8')); const minimumNodeMajor = Number(/^>=\s*(\d+)/.exec(packageJson.engines.node)?.[1]); const expectedPnpmVersion = /^pnpm@(.+)$/.exec(packageJson.packageManager)?.[1]; const userAgent = process.env.npm_config_user_agent ?? ''; const pnpmVersion = /^pnpm\/([^ ]+)/.exec(userAgent)?.[1]; const agentNodeVersion = /node\/v([^ ]+)/.exec(userAgent)?.[1]; assert(Number(process.versions.node.split('.')[0]) >= minimumNodeMajor, 'Node runtime does not satisfy package.json engines.node'); assert.strictEqual(pnpmVersion, expectedPnpmVersion, 'pnpm runtime does not match package.json packageManager'); assert.strictEqual(agentNodeVersion, process.versions.node, 'pnpm exec node did not resolve to the setup-node runtime');"

      - name: Validate V1 release contract
        run: pnpm validate:v1-contract

      - name: Test V1 release contract
        run: pnpm test:v1-contract
      - name: Test gameplay music transport
        run: pnpm test:music-transport
      - name: Validate gameplay music assets
        run: pnpm validate:music-assets
      - name: Test gameplay music validator
        run: pnpm test:music-validator
      - name: Validate card artwork
        run: pnpm validate:card-art
      - name: Test card artwork validator
        run: pnpm test:card-art
      - name: Validate landmark artwork
        run: pnpm validate:landmark-art
      - name: Test landmark artwork validator
        run: pnpm test:landmark-art
      - name: Prepare Windows signing certificate
        if: matrix.platform == 'win32' && inputs.distribution_mode == 'signed'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.OWN_THE_BLOCK_WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.OWN_THE_BLOCK_WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) { throw 'Windows signing certificate secret is required for signed distribution.' }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) { throw 'Windows signing certificate password secret is required for signed distribution.' }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'own-the-block-signing.pfx'
          [System.IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          "OWN_THE_BLOCK_WINDOWS_CERTIFICATE_FILE=$certificatePath" >> $env:GITHUB_ENV
          "OWN_THE_BLOCK_WINDOWS_CERTIFICATE_PASSWORD=$env:WINDOWS_CERTIFICATE_PASSWORD" >> $env:GITHUB_ENV
      - name: Prepare macOS signing and notarization inputs
        if: matrix.platform == 'darwin' && inputs.distribution_mode == 'signed'
        shell: bash
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.OWN_THE_BLOCK_MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.OWN_THE_BLOCK_MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.OWN_THE_BLOCK_MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.OWN_THE_BLOCK_APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.OWN_THE_BLOCK_APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.OWN_THE_BLOCK_APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          required_names=(
            MACOS_CERTIFICATE_BASE64
            MACOS_CERTIFICATE_PASSWORD
            MACOS_SIGN_IDENTITY
            APPLE_ID
            APPLE_APP_SPECIFIC_PASSWORD
            APPLE_TEAM_ID
          )
          for name in "${required_names[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "$name secret is required for signed distribution."
              exit 1
            fi
          done

          certificate_path="$RUNNER_TEMP/own-the-block-macos-signing.p12"
          keychain_path="$RUNNER_TEMP/own-the-block-macos-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          chmod 600 "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -s "$keychain_path"
          if ! security find-identity -v -p codesigning "$keychain_path" | grep -Fq "$MACOS_SIGN_IDENTITY"; then
            echo 'Requested Developer ID Application identity was not found in the temporary keychain.'
            exit 1
          fi

          {
            echo "OWN_THE_BLOCK_MACOS_SIGN_IDENTITY=$MACOS_SIGN_IDENTITY"
            echo "OWN_THE_BLOCK_APPLE_ID=$APPLE_ID"
            echo "OWN_THE_BLOCK_APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD"
            echo "OWN_THE_BLOCK_APPLE_TEAM_ID=$APPLE_TEAM_ID"
            echo "OWN_THE_BLOCK_MACOS_CERTIFICATE_FILE=$certificate_path"
            echo "OWN_THE_BLOCK_MACOS_KEYCHAIN=$keychain_path"
          } >> "$GITHUB_ENV"
      - name: Typecheck desktop
        run: pnpm --filter @monopoly/desktop typecheck
      - name: Test desktop
        run: pnpm --filter @monopoly/desktop test
      - name: Build and collect release candidate
        run: pnpm desktop:release
      - name: Run packaged Phase 7 runtime proof
        run: pnpm --filter @monopoly/desktop proof:packaged
      - name: Run packaged Phase 7.2 Host proof
        run: pnpm --filter @monopoly/desktop proof:packaged:host
      - name: Verify packaged gameplay music
        run: pnpm --filter @monopoly/desktop proof:packaged:audio
      - name: Verify packaged card artwork
        run: pnpm --filter @monopoly/desktop proof:packaged:cards
      - name: Verify packaged landmark artwork
        run: pnpm --filter @monopoly/desktop proof:packaged:landmarks
      - name: Check packaged size budget
        run: pnpm --filter @monopoly/desktop proof:packaged:budget
      - name: Verify macOS disk image
        if: matrix.platform == 'darwin'
        shell: bash
        run: |
          dmg_path="$(find apps/desktop/out/make -type f -name '*.dmg' -print -quit)"
          test -n "$dmg_path" || { echo 'The macOS DMG was not found.'; exit 1; }
          ls -l "$dmg_path"
          hdiutil verify "$dmg_path"
      - name: Verify collected artifact metadata
        run: pnpm validate:release -- --release --artifacts
      - name: Verify Windows Authenticode signature
        if: matrix.platform == 'win32' && inputs.distribution_mode == 'signed'
        shell: pwsh
        run: |
          $setup = Get-ChildItem 'apps/desktop/out/make/squirrel.windows/x64/*Setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'Squirrel setup executable was not found.' }
          $signature = Get-AuthenticodeSignature $setup.FullName
          if ($signature.Status -ne 'Valid') { throw "Authenticode verification failed: $($signature.Status)" }
      - name: Verify macOS code signature and notarization
        if: matrix.platform == 'darwin' && inputs.distribution_mode == 'signed'
        shell: bash
        run: |
          app_path=$(find apps/desktop/out -type d -name '*.app' -print -quit)
          dmg_path=$(find apps/desktop/out/make -type f -name '*.dmg' -print -quit)
          test -n "$app_path" || { echo 'Packaged macOS app was not found.'; exit 1; }
          test -n "$dmg_path" || { echo 'Packaged macOS DMG was not found.'; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign --verify --verbose=2 "$dmg_path"
          xcrun stapler validate "$dmg_path"
      # Only the installers and the collected metadata are uploaded: the publish job stages the installer listed in
      # manifest.json, and the Squirrel .nupkg/RELEASES (already embedded in Setup.exe) would double the Windows
      # artifact. The files are already compressed, so the artifact zip does not recompress them.
      - name: Upload release candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            apps/desktop/out/make/**/*Setup.exe
            apps/desktop/out/make/**/*.dmg
            apps/desktop/out/release-artifacts/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Clean up macOS signing material
        if: matrix.platform == 'darwin' && inputs.distribution_mode == 'signed' && always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/own-the-block-macos-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/own-the-block-macos-signing.p12"

  publish:
    name: Publish GitHub Release
    # Only a pushed version tag publishes, and only after every target above has passed (`needs`).
    if: startsWith(github.ref, 'refs/tags/')
    needs: distributable
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download the target artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Stage the release files
        run: node apps/desktop/scripts/stageReleaseAssets.mjs --artifacts release-assets --out release-upload --version "${GITHUB_REF_NAME#v}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=()
          # A tag with a suffix (v1.0.1-rc.1) becomes a pre-release; a plain version becomes the latest release.
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          # Created as a draft and published once every file is uploaded, so nobody sees a half-uploaded release.
          gh release create "$GITHUB_REF_NAME" release-upload/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "Own the Block $GITHUB_REF_NAME" \
            --notes-file ".github/release-notes/$GITHUB_REF_NAME.md" \
            "${flags[@]}"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
