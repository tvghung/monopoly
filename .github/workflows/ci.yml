name: CI

on:
  push:
    branches:
      - main
      - 'overhaul/**'
  pull_request:
  workflow_dispatch:

# Least-privilege token: the build only needs to read the repo contents.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://monopoly:monopoly@localhost:5432/monopoly
      TEST_DATABASE_URL: postgresql://monopoly:monopoly@localhost:5432/monopoly
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: monopoly
          POSTGRES_USER: monopoly
          POSTGRES_PASSWORD: monopoly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monopoly -d monopoly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
