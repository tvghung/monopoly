name: Desktop Build

on:
  pull_request:
    paths:
      - 'apps/client/**'
      - 'apps/desktop/**'
      - 'apps/server/**'
      - 'packages/shared/**'
      - 'scripts/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'playwright.global-setup.ts'
      - 'project-document/**'
      - 'README.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/desktop-build.yml'
      - '.github/workflows/release-candidate.yml'
  push:
    branches:
      - main
      - 'overhaul/**'
      - 'codex/**'
    paths:
      - 'apps/client/**'
      - 'apps/desktop/**'
      - 'apps/server/**'
      - 'packages/shared/**'
      - 'scripts/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'playwright.global-setup.ts'
      - 'project-document/**'
      - 'README.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/desktop-build.yml'
      - '.github/workflows/release-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate V1 release contract
        run: pnpm validate:v1-contract

      - name: Test V1 release contract
        run: pnpm test:v1-contract

      - name: Test segmented music transport
        run: pnpm test:music-transport

      - name: Install audio validation tools (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress

      - name: Install audio validation tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install ffmpeg
          brew reinstall ffmpeg
          brew link --overwrite ffmpeg
          ffmpeg -hide_banner -encoders | grep -q 'libvorbis'
          ffprobe -version

      - name: Test production music pipeline
        run: pnpm test:music-pipeline

      - name: Test segmented production music validator
        run: pnpm test:music-validator

      - name: Typecheck desktop
        run: pnpm --filter @monopoly/desktop typecheck

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Test desktop
        run: pnpm --filter @monopoly/desktop test

      - name: Build renderer
        run: pnpm build

      - name: Build desktop distributable
        run: pnpm desktop:make

      - name: Run packaged Phase 7 runtime proof
        run: pnpm --filter @monopoly/desktop proof:packaged

      - name: Run packaged Phase 7.2 Host proof
        run: pnpm --filter @monopoly/desktop proof:packaged:host

      - name: Verify packaged gameplay music
        run: pnpm --filter @monopoly/desktop proof:packaged:audio

      - name: Install mobile browser engines
        run: pnpm exec playwright install chromium webkit

      - name: Run mobile Chromium and WebKit flows
        run: pnpm exec playwright test

      - name: Upload Windows Squirrel artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: own-the-block-windows-squirrel
          path: apps/desktop/out/make/squirrel.windows/**
          if-no-files-found: error

      - name: Upload macOS DMG artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: own-the-block-macos-dmg
          path: apps/desktop/out/make/**/*.dmg
          if-no-files-found: error
